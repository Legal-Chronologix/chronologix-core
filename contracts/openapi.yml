# contracts/openapi.yaml

openapi: 3.1.0

info:
  title: Chronologix API
  version: 0.1.0
  description: API for Chronologix prototype.

servers:
  - url: http://localhost:8000
    description: Local development server

paths:
  /health:
    get:
      tags:
        - health
      operationId: getHealth
      summary: Health check
      responses:
        "200":
          description: API is running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

components:
  schemas:
    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          example: ok